ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: false
    print_diagnostics: true
    use_control: false
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /qr/fusion/wheel_input
    # chassis模式vx/vy来自原底盘真实反馈，包含横移；legacy模式仍只限vy=0约束。
    # 不重复融合同一反馈积分出的旧位姿，也不融合旧底盘角速度。
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    odom0_differential: false
    odom0_queue_size: 20
    imu0: /qr/fusion/imu_input
    # IMU只用校零并投影后的竖直轴角速度；没有绝对朝向，不积分加速度。
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: false
