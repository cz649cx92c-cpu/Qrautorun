qr_yahboom_imu:
  ros__parameters:
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baud: 115200
    imu_topic: /qr/imu/raw
    frame_id: imu_link
    max_age_s: 0.25
    reconnect_s: 1.0
    max_backlog_bytes: 512
    # Raw sensor axes; physical direction/mounting validation remains outstanding.
    mounting_direction_verified: false
